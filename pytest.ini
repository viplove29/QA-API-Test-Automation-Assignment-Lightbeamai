[pytest]
testpaths = tests
addopts = -ra --html=reports/api-test-report.html --self-contained-html --css=assets/report_style.css
markers =
    auth: authentication and authorization endpoint coverage
    orders: order creation, state transition, and cancellation coverage
    exports: export job status and CSV download coverage
    smoke: critical successful API workflow coverage
    negative: API validation, authorization, conflict, and not-found coverage
    lifecycle: stateful order or export transition coverage
    slow: test exercises the real long-running export workflow