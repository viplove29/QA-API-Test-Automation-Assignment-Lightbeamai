name: API Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Start mock API
        run: npm run start > mock-api.log 2>&1 &
      - name: Wait for mock API
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent --show-error --request POST \
              --header "Content-Type: application/json" \
              --data '{"username":"health-check","apiKey":"health-check"}' \
              http://localhost:3000/v1/auth/login; then
              exit 0
            fi
            sleep 1
          done
          cat mock-api.log
          exit 1
      - name: Run API tests
        run: python -m pytest -q --junitxml=test-results/junit.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: |
            test-results/junit.xml
            reports/api-test-report.html